name: Publicar Doctorado en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Validar instrumentos y archivos JavaScript
        run: |
          npm test
          npm run check

      - name: Comprobar base principal (Neon)
        continue-on-error: true
        run: |
          API=$(node -e "import('./src/config.js').then(m=>console.log(m.API))")
          echo "Salud: $(curl -sS -m 30 "$API/salud")"
          echo "Respuesta inválida (se espera 400): $(curl -sS -m 30 -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Origin: https://jeffer91.github.io' -d '{}' "$API/respuestas")"
          echo "Acceso sin sesión (se espera 401): $(curl -sS -m 30 -o /dev/null -w '%{http_code}' "$API/admin/respuestas")"
          echo "CORS: $(curl -sS -m 30 -o /dev/null -D - -X OPTIONS -H 'Origin: https://jeffer91.github.io' -H 'Access-Control-Request-Method: POST' "$API/respuestas" | grep -i 'access-control-allow-origin')"

      - name: Preparar sitio estático
        env:
          FIREBASE_WEB_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: |
          mkdir -p dist
          cp index.html dist/
          cp .nojekyll dist/
          cp -R assets src dist/
          node <<'NODE'
          const fs = require('node:fs');
          const raw = process.env.FIREBASE_WEB_CONFIG || "";
          let config = null;
          if (raw.trim()) {
            config = JSON.parse(raw);
            for (const key of ['apiKey','authDomain','projectId','appId']) {
              if (!config[key]) throw new Error('Falta el campo Firebase: '+key);
            }
          }
          fs.writeFileSync('dist/runtime-config.js', 'window.DOCTORADO_FIREBASE_CONFIG = ' + JSON.stringify(config) + ';\n');
          console.log(config ? 'Configuración web de Firebase preparada' : 'Publicando vista sin integración Firebase (secreto pendiente)');
          NODE

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
