name: Sincronizar Firebase UTET con Neon

on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-utet.mjs'
      - 'scripts/utet-normalizar.mjs'
      - '.github/workflows/sync-utet.yml'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: doctorado-utet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FIREBASE_UTET_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_UTET_SERVICE_ACCOUNT_JSON }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - name: Obtener rama main
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar mapeo por período
        run: node --test tests/utet-sync.test.js
      - name: Verificar que las credenciales estén configuradas
        if: env.FIREBASE_UTET_SERVICE_ACCOUNT_JSON == '' || env.NEON_DATABASE_URL == ''
        run: echo "::warning::Faltan credenciales privadas. Configura los secretos FIREBASE_UTET_SERVICE_ACCOUNT_JSON y NEON_DATABASE_URL."
      - name: Sincronizar clasificaciones por cédula y período
        if: env.FIREBASE_UTET_SERVICE_ACCOUNT_JSON != '' && env.NEON_DATABASE_URL != ''
        run: node scripts/sync-utet.mjs
